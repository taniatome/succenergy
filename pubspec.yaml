name: succenergy_ai_coach
description: "Succenergy AI Coach by Dr. Leadership Tania Tome - personal development coaching built on the Succenergy methodology."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  intl: ^0.19.0
  url_launcher: ^6.3.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/google_fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/succenergy_app_icon.png"
  adaptive_icon_background: "#0A1628"
  adaptive_icon_foreground: "assets/branding/succenergy_app_icon.png"
  remove_alpha_ios: true
